<!doctype html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageMagick</title>
  <style>
    :root {
      --bg: #050505;
      --card: #0f0f0f;
      --accent: #ffffff; 
      --text: #e0e0e0;
      --dim: #666666;
      --border: #222222;
      --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0 !important; }
    body { background-color: var(--bg); color: var(--text); font-family: var(--mono); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 15px; }
    .card { background-color: var(--card); border: 1px solid var(--border); padding: 24px; position: relative; }
    .label { font-size: 10px; color: var(--dim); margin-bottom: 15px; display: block; letter-spacing: 2px; text-transform: uppercase; border-left: 2px solid var(--accent); padding-left: 10px; }
    .status-box { font-size: 11px; color: var(--accent); padding: 12px; background: #000; border: 1px solid var(--border); margin-bottom: 10px; opacity: 0.8; }
    textarea { width: 100%; height: 100px; background: #000; color: var(--accent); border: 1px solid var(--border); padding: 15px; font-family: var(--mono); font-size: 14px; line-height: 1.5; resize: vertical; outline: none; }
    .btn-main { width: 100%; background: var(--accent); color: #000; border: none; padding: 18px; cursor: pointer; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; }
    .btn-main:hover { filter: brightness(1.1); }
    .btn-main:disabled { background: var(--dim); cursor: not-allowed; }
    #log-container { margin-top: 10px; height: 180px; background: #000; border: 1px solid var(--border); padding: 12px; overflow-y: auto; font-size: 11px; color: #888; line-height: 1.6; }
    .log-entry { border-bottom: 1px solid #111; padding: 2px 0; }
    .log-success { color: var(--accent); }
    .log-error { color: #ff4444; }
    .log-info { color: #5bc0de; }
    #preview-area {
    display: grid;
    grid-template-columns: repeat(auto-fit, 220px);
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
}
    #preview-area img { width: 100%; border: 1px solid var(--border); background: #111; }
    .preview-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}
textarea::-webkit-scrollbar {
    width: 8px;
}

textarea::-webkit-scrollbar-track {
    background: #000;
}

textarea::-webkit-scrollbar-thumb {
    background: var(--accent);
    border: 1px solid #000;
}

textarea::-webkit-scrollbar-thumb:hover {
    filter: brightness(1.2);
}
  </style>
</head>

<body>
  <div class="app-container">
    <div class="card">
      <span class="label">Step 01 / 目录挂载</span>
      <div class="status-box">DISK: <span id="dir-status">OFFLINE</span></div>
      <button id="auth-btn" class="btn-main" style="padding: 10px;">MOUNT DIRECTORY</button>
    </div>

    <div class="card">
      <span class="label">Step 02 / 键入指令</span>
      <textarea id="text-area" spellcheck="false">magick input.jpg -charcoal 5 output.png</textarea>
      <div style="font-size: 10px; color: var(--dim); margin-top: 10px;">支持多输入: magick a.jpg b.jpg +append combined.png</div>
    </div>

    <div class="card" style="border-top: none;">
      <button id="execute-btn" class="btn-main" disabled>EXECUTE COMMAND</button>
      <div id="log-container">
        <div class="log-entry">系统就绪。请授权工作目录。</div>
      </div>
    </div>
    <div id="preview-area"></div>
  </div>
  <script type='module'>
    import * as Magick from './wasm-imagemagick/magickApi.js';
    let directoryHandle = null;
    const dom = {
      auth: document.getElementById("auth-btn"),
      exec: document.getElementById("execute-btn"),
      status: document.getElementById("dir-status"),
      cmd: document.getElementById("text-area"),
      logs: document.getElementById("log-container"),
      preview: document.getElementById("preview-area")
    };

    const appendLog = (msg, type = '') => {
      const el = document.createElement('div');
      el.className = `log-entry ${type}`;
      el.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
      dom.logs.appendChild(el);
      dom.logs.scrollTop = dom.logs.scrollHeight;
    };

    dom.auth.onclick = async () => {
      try {
        directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        dom.status.textContent = `ONLINE / ${directoryHandle.name.toUpperCase()}`;
        dom.exec.disabled = false;
        appendLog(`目录 "${directoryHandle.name}" 已成功挂载。`, 'log-success');
      } catch (err) {
        appendLog("授权失败。", 'log-error');
      }
    };

    dom.exec.onclick = async () => {
      if (!directoryHandle) return;
      
      const fullCmd = dom.cmd.value.trim();
      if (!fullCmd) return;

      dom.exec.disabled = true;
      dom.preview.innerHTML = "";
      
      try {
        const parts = fullCmd.split(/\s+/).filter(p => p.length > 0);
        const commandArray = parts[0].toLowerCase() === 'magick' ? parts.slice(1) : parts;
        const possibleFiles = commandArray.filter(p => p.includes('.') && !p.startsWith('-'));
        const outputName = commandArray[commandArray.length - 1]; 
        const inputNames = possibleFiles.filter(f => f !== outputName);
        appendLog(`解析指令: ${fullCmd}`, 'log-info');
        const inputFiles = [];
        for (const name of inputNames) {
          try {
            appendLog(`正在读取本地文件: ${name}...`);
            const fHandle = await directoryHandle.getFileHandle(name);
            const file = await fHandle.getFile();
            const buffer = await file.arrayBuffer();
            inputFiles.push({ name: name, content: new Uint8Array(buffer) });
          } catch (e) {
            appendLog(`警告: 未在目录中找到文件 "${name}"`, 'log-error');
          }
        }

        if (inputFiles.length === 0 && inputNames.length > 0) {
          throw new Error("没有找到任何可用的输入文件。");
        }
        appendLog("WASM 核心计算中...");
        const result = await Magick.execute({
          inputFiles: inputFiles,
          commands: [commandArray]
        });
        if (result.outputFiles && result.outputFiles.length > 0) {
          for (const outFile of result.outputFiles) {
            const newHandle = await directoryHandle.getFileHandle(outFile.name, { create: true });
            const writable = await newHandle.createWritable();
            await writable.write(outFile.buffer);
            await writable.close();
            appendLog(`写入成功: ${outFile.name}`, 'log-success');
            const url = URL.createObjectURL(new Blob([outFile.buffer]));
            dom.preview.insertAdjacentHTML('beforeend', `
              <div class="preview-item">
                <span style="font-size:9px; color:var(--dim)">${outFile.name}</span>
                <img src="${url}">
              </div>
            `);
          }
        } else {
          appendLog("执行成功，但没有产生输出文件。", 'log-info');
        }

      } catch (err) {
        appendLog(`错误: ${err.message}`, 'log-error');
      } finally {
        dom.exec.disabled = false;
      }
    };
  </script>
</body>
</html>
